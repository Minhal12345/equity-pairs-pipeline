name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Run data quality monitor (fixture mode)
        run: |
          python -c "
          import numpy as np, pandas as pd
          from pathlib import Path
          rng = np.random.default_rng(42)
          fixture_dir = Path('test_fixtures/raw/yfinance')
          fixture_dir.mkdir(parents=True, exist_ok=True)
          proc_dir = Path('test_fixtures/processed')
          proc_dir.mkdir(parents=True, exist_ok=True)
          end = pd.Timestamp.now().normalize()
          dates = pd.bdate_range(end=end, periods=252, freq='B')
          for t in ['AAPL', 'MSFT']:
              price = 100 + rng.standard_normal(252).cumsum()
              price = np.maximum(price, 1)
              df = pd.DataFrame({
                  'open': price * 1.001, 'high': price * 1.01,
                  'low': price * 0.99, 'close': price,
                  'volume': rng.integers(1_000_000, 50_000_000, 252)
              }, index=pd.Index(dates, name='date'))
              df.to_parquet(fixture_dir / f'{t}.parquet')
          recon = pd.DataFrame({
              'yf_close': [150.0]*50, 'av_close': [float('nan')]*50,
              'divergence_pct': [float('nan')]*50,
              'flag_divergence': [False]*50, 'ticker': ['AAPL']*25 + ['MSFT']*25
          }, index=pd.Index(pd.bdate_range(end=end, periods=50), name='date'))
          recon.to_parquet(proc_dir / 'reconciliation.parquet')
          "
          python -m src.monitor --raw-dir test_fixtures/raw/yfinance --processed-dir test_fixtures/processed --output test_fixtures/quality_report.json
